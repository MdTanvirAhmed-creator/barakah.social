name: Encrypted database backup

# A backup we own, independent of the hosting provider. Supabase's own
# point-in-time recovery only exists on paid plans, and a backup that lives
# solely inside the thing it is protecting is not a backup.
#
# Required repository secrets (see docs/phase-6-setup.md):
#   SUPABASE_DB_URI       postgres connection URI; see the note on pooling below
#   BACKUP_PASSPHRASE     long random string; without it the archive cannot be read
#   CLOUDFLARE_ACCOUNT_ID Cloudflare account id
#   R2_ACCESS_KEY_ID      R2 API token access key
#   R2_SECRET_ACCESS_KEY  R2 API token secret
#   R2_BUCKET             bucket name, e.g. barakah-backups
#
# On the connection URI: GitHub's runners are IPv4-only, and Supabase's direct
# db.<ref>.supabase.co host resolves to IPv6 only. Use the session-mode pooler
# (port 5432 on the pooler host), not the direct host and not transaction mode
# — pg_dump needs a session, so port 6543 will not work.
#
# Secrets are passed through env rather than interpolated into the scripts, so
# a value containing a quote or backtick cannot break or inject into the shell.

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily, off the hour to avoid the stampede
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, upload
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: creds
        env:
          DB_URI: ${{ secrets.SUPABASE_DB_URI }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BUCKET: ${{ secrets.R2_BUCKET }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          [ -z "$DB_URI" ]     && missing="$missing SUPABASE_DB_URI"
          [ -z "$PASSPHRASE" ] && missing="$missing BACKUP_PASSPHRASE"
          [ -z "$BUCKET" ]     && missing="$missing R2_BUCKET"
          [ -z "$ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$KEY_ID" ]     && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "$KEY_SECRET" ] && missing="$missing R2_SECRET_ACCESS_KEY"

          if [ -n "$missing" ]; then
            # A backup that quietly does nothing is worse than one that fails,
            # so only the scheduled run is allowed to skip. Asking for a backup
            # by hand and getting silence is how a gap goes unnoticed.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Missing secret(s):$missing — see docs/phase-6-setup.md."
              exit 1
            fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Backup secrets are not configured yet — skipping.$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL client
        if: steps.creds.outputs.ready == 'true'
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump
        if: steps.creds.outputs.ready == 'true'
        env:
          PGSSLMODE: require
          DB_URI: ${{ secrets.SUPABASE_DB_URI }}
        run: |
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # Roles and tablespaces belong to the platform, not to us; --no-owner
          # keeps the dump restorable into a fresh project.
          pg_dump --no-owner --no-privileges --format=custom \
            --file="barakah-$STAMP.dump" "$DB_URI"
          ls -lh "barakah-$STAMP.dump"

      - name: Encrypt
        if: steps.creds.outputs.ready == 'true'
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # Symmetric AES-256. The passphrase never touches the archive, and
          # without it the file is inert — including to whoever holds the bucket.
          printf '%s' "$PASSPHRASE" > /tmp/pp
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase-file /tmp/pp \
            --output "barakah-$STAMP.dump.gpg" "barakah-$STAMP.dump"
          shred -u /tmp/pp
          rm -f "barakah-$STAMP.dump"
          ls -lh "barakah-$STAMP.dump.gpg"

      - name: Upload to R2
        if: steps.creds.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BUCKET: ${{ secrets.R2_BUCKET }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # R2 does not implement the streaming checksum trailers the AWS CLI
          # started sending by default; without these it rejects the upload.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 cp "barakah-$STAMP.dump.gpg" \
            "s3://$BUCKET/daily/barakah-$STAMP.dump.gpg" \
            --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com"

      - name: Prune backups older than 30 days
        if: steps.creds.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BUCKET: ${{ secrets.R2_BUCKET }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          CUTOFF="$(date -u -d '30 days ago' +%Y-%m-%d)"
          aws s3 ls "s3://$BUCKET/daily/" \
            --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com" \
          | awk '{print $4}' | while read -r key; do
              [ -z "$key" ] && continue
              day="$(echo "$key" | sed -n 's/^barakah-\([0-9-]\{10\}\)T.*/\1/p')"
              [ -z "$day" ] && continue
              if [ "$day" \< "$CUTOFF" ]; then
                echo "pruning $key"
                aws s3 rm "s3://$BUCKET/daily/$key" \
                  --endpoint-url "https://$ACCOUNT_ID.r2.cloudflarestorage.com"
              fi
            done

      - name: Report
        if: steps.creds.outputs.ready == 'true'
        run: echo "::notice::Backup barakah-$STAMP.dump.gpg uploaded and old copies pruned."
