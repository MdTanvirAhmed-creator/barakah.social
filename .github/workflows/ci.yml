name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Lint and Type Check
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src
        continue-on-error: true

      - name: Adab check (sacred text is never texture)
        run: ./scripts/adab-check.sh

      - name: Contrast check (WCAG AA on both themes)
        run: node scripts/contrast-check.mjs

      - name: Type check
        run: npx tsc --noEmit

  # Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Database rebuild + RLS policy tests against a local Supabase stack.
  # Proves: (1) `supabase db reset` rebuilds the whole schema from migrations,
  # (2) row-level security actually isolates users (tests/rls/).
  rls-tests:
    name: DB Reset & RLS Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Start local Supabase (applies migrations)
        run: supabase start

      - name: Verify full schema rebuild from migrations
        run: supabase db reset

      - name: Run RLS tests
        run: npm run test:rls

  # Build Application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Secret audit (no service_role in client bundle)
        run: bash scripts/audit-client-bundle.sh

  # E2E Tests with Playwright (optional — requires running server)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      # The companions spec drives two real accounts through the privacy
      # boundary, so it needs a real stack — the same one the RLS job uses.
      - name: Start local Supabase (applies migrations)
        run: supabase start

      # `npm run dev:local` is the harness these specs are written against:
      # it points the app at the local stack through a same-origin /sb-local
      # rewrite and is the configuration they are verified in. A production
      # `next start` build against the same stack never establishes a client
      # session — it issues the auth token request and then no PostgREST
      # calls at all, leaving data views stuck on "Loading…". That anomaly is
      # worth chasing separately; it is not what this job exists to catch.
      - name: Start the app against the local stack
        run: |
          npm run dev:local &
          npx wait-on -t 120000 http://localhost:3000

      # Chromium only. The stateful specs drive the desktop layout (the
      # sidebar search does not exist on the mobile breakpoint), so running
      # the full five-project matrix fails for reasons that have nothing to
      # do with the code under test. Broader browser coverage needs specs
      # written for it — a separate piece of work.
      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          E2E_LOCAL_SUPABASE: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Lighthouse CI (optional — requires LHCI token)
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build]
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and start server
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  # Note: Deployments are handled automatically by Vercel's GitHub integration.
